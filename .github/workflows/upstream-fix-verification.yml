{
  "name": "Contribution checks",
  "on": {
    "push": {
      "branches": [
        "verify/upstream-fixes-20261018"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "cdk": {
      "name": "${{ matrix.lane }} quick-check",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 55,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 3,
        "matrix": {
          "include": [
            {
              "lane": "cdk-selection",
              "ref": "d807412a10424d21c02f91783a60cec6b0c37ee2"
            },
            {
              "lane": "cdk-http",
              "ref": "1b15d37916d86981bc5462f929b6250fc5ad0698"
            },
            {
              "lane": "cdk-sqlite",
              "ref": "fa56bf7a63624f54882d6887ec7aef4bcf18c96a"
            }
          ]
        }
      },
      "env": {
        "CARGO_INCREMENTAL": "0",
        "CARGO_PROFILE_DEV_DEBUG": "0",
        "CARGO_PROFILE_TEST_DEBUG": "0",
        "CARGO_BUILD_JOBS": "2"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "mmalmi/cdk",
            "ref": "${{ matrix.ref }}",
            "path": "source",
            "persist-credentials": false
          }
        },
        {
          "name": "System dependencies",
          "run": "sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev cmake"
        },
        {
          "name": "Rust",
          "working-directory": "source",
          "run": "rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt\nrustup override set 1.99.0"
        },
        {
          "uses": "taiki-e/install-action@v2",
          "with": {
            "tool": "just,typos-cli@1.46.3,nixpkgs-fmt@1.3.0"
          }
        },
        {
          "uses": "Swatinem/rust-cache@v2",
          "with": {
            "workspaces": "source -> target",
            "key": "upstream-${{ matrix.lane }}"
          }
        },
        {
          "name": "Contribution gate",
          "working-directory": "source",
          "run": "set -o pipefail\ngit rev-parse HEAD\njust quick-check 2>&1 | tee quick-check.log"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "${{ matrix.lane }}-quick-check",
            "path": "source/quick-check.log",
            "if-no-files-found": "ignore"
          }
        }
      ]
    }
  }
}
